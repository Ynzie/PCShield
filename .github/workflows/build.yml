name: Build

# Every push / PR: run the tests and build PCShield.exe (downloadable from the run's "Artifacts").
# Pushing a version tag (git tag v1.2.0 && git push --tags) also publishes a Release with the exe attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on tag pushes

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install psutil
      - name: Backend tests (Windows parts are stubbed in tests/fakewin.py)
        run: python tests/test_backend.py

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - name: Build with build.bat
        shell: cmd
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: build.bat
      - name: Self-test the packaged exe (loads every library and bundled file, then exits)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist\PCShield.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }
          "{0:N1} MB" -f ((Get-Item dist\PCShield.exe).Length / 1MB)
      - name: Windows security tests (data-folder lock, junctions, task retargeting, known folders)
        shell: cmd
        run: '"${{ steps.py.outputs.python-path }}" tests\test_windows.py'
      - uses: actions/upload-artifact@v6
        with:
          name: PCShield
          path: dist/PCShield.exe
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/PCShield.exe
          generate_release_notes: true
